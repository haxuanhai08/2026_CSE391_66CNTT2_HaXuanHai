<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Điểm Sinh Viên</title>
    <style>
        .highlight-weak { background-color: #ffff00; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background-color: #f4f4f4; }
        .input-group { margin-bottom: 20px; }
        .stats { margin-top: 15px; font-weight: bold; font-size: 1.1em; color: #333; }
        button { cursor: pointer; padding: 5px 10px; }
    </style>
</head>
<body>

    <h2>Quản Lý Điểm Sinh Viên</h2>

    <div class="input-group">
        <input type="text" id="txtName" placeholder="Họ tên sinh viên">
        <input type="number" id="txtScore" placeholder="Điểm (0-10)" step="0.1" min="0" max="10">
        <button id="btnAdd">Thêm</button>
    </div>
    <div style="margin: 20px 0; display: flex; gap: 10px; align-items: center;">
        <input type="text" id="txtSearch" placeholder="Tìm kiếm tên...">
    
        <select id="selRank">
            <option value="All">Tất cả xếp loại</option>
            <option value="Giỏi">Giỏi</option>
            <option value="Khá">Khá</option>
            <option value="Trung bình">Trung bình</option>
            <option value="Yếu">Yếu</option>
        </select>

    </div>
    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th id="sortScore" style="cursor: pointer; user-select: none;">
                Điểm <span id="sortIcon">↕</span></th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="tbodyStudent">
            </tbody>
    </table>

    <div class="stats" id="statsArea">
        Tổng số sinh viên: 0 | Điểm trung bình lớp: 0
    </div>

    <script src="Bai1.2.js"></script>
</body>
</html>

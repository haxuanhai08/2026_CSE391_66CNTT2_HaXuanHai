<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Đặt Hàng Nâng Cao</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; background: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: red; font-size: 0.85em; margin-top: 5px; display: none; }
        .char-count { font-size: 0.8em; text-align: right; margin-top: 2px; }
        .total-price { font-size: 1.2em; color: #2c3e50; font-weight: bold; margin: 15px 0; }
        
        /* Modal xác nhận */
        #confirm-box { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; border: 2px solid #333; padding: 20px; z-index: 100; border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3); width: 300px;
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛒 Đặt Hàng Trực Tuyến</h2>
    <form id="orderForm">
        <div class="form-group">
            <label>Tên sản phẩm *</label>
            <select id="product">
                <option value="">-- Chọn sản phẩm --</option>
                <option value="ao">Áo thun (150.000đ)</option>
                <option value="quan">Quần Jeans (350.000đ)</option>
                <option value="giay">Giày Sneaker (500.000đ)</option>
            </select>
            <div class="error" id="err-product">Vui lòng chọn sản phẩm</div>
        </div>

        <div class="form-group">
            <label>Số lượng (1-99) *</label>
            <input type="number" id="quantity" value="1">
            <div class="error" id="err-quantity">Số lượng từ 1 đến 99</div>
        </div>

        <div class="total-price">Tổng tiền: <span id="display-total">0</span>đ</div>

        <div class="form-group">
            <label>Ngày giao hàng *</label>
            <input type="date" id="deliveryDate">
            <div class="error" id="err-date">Ngày giao không hợp lệ (trong vòng 30 ngày tới)</div>
        </div>

        <div class="form-group">
            <label>Địa chỉ giao hàng *</label>
            <textarea id="address" rows="2"></textarea>
            <div class="error" id="err-address">Địa chỉ phải ít nhất 10 ký tự</div>
        </div>

        <div class="form-group">
            <label>Ghi chú (không bắt buộc)</label>
            <textarea id="note" rows="2"></textarea>
            <div class="char-count" id="note-count">0/200</div>
            <div class="error" id="err-note">Ghi chú không quá 200 ký tự</div>
        </div>

        <div class="form-group">
            <label>Phương thức thanh toán *</label>
            <input type="radio" name="payment" value="COD" style="width: auto;"> COD 
            <input type="radio" name="payment" value="Bank" style="width: auto;"> Chuyển khoản
            <div class="error" id="err-payment">Vui lòng chọn phương thức thanh toán</div>
        </div>

        <button type="submit" style="background: #27ae60; color: white; padding: 10px; border: none; width: 100%; cursor: pointer;">ĐẶT HÀNG</button>
    </form>
</div>

<div class="overlay" id="overlay"></div>
<div id="confirm-box">
    <h3>Xác nhận đặt hàng?</h3>
    <div id="summary-content"></div>
    <div style="margin-top: 15px; display: flex; justify-content: space-between;">
        <button onclick="finalSubmit()" style="background: #27ae60; color: white; border:none; padding: 8px 15px;">Xác nhận</button>
        <button onclick="closeConfirm()" style="background: #e74c3c; color: white; border:none; padding: 8px 15px;">Hủy</button>
    </div>
</div>

<script src="Bai2.2.js"></script>
</body>
</html>

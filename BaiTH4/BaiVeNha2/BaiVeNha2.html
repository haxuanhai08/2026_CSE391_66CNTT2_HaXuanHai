<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Nhiều Bước</title>
    <style>
        :root { --primary-color: #007bff; --bg-color: #f8f9fa; }
        body { font-family: 'Arial', sans-serif; background: var(--bg-color); display: flex; justify-content: center; padding-top: 50px; }
        .form-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; }
        
        /* Thanh tiến trình */
        .progress-bar-container { background: #e9ecef; height: 10px; border-radius: 5px; margin-bottom: 20px; position: relative; }
        #progress-fill { background: var(--primary-color); height: 100%; width: 33%; transition: 0.4s; border-radius: 5px; }
        .step-indicator { text-align: center; font-weight: bold; margin-bottom: 20px; color: #555; }

        .form-step { display: none; }
        .form-step.active { display: block; animation: fadeIn 0.5s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary-color); }
        
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        button { padding: 10px 25px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        #nextBtn { background: var(--primary-color); color: white; }
        #nextBtn:disabled { background: #ccc; cursor: not-allowed; }
        #prevBtn { background: #6c757d; color: white; }

        .review-box { background: #f1f3f5; padding: 15px; border-radius: 8px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="form-box">
    <div class="progress-bar-container"><div id="progress-fill"></div></div>
    <div class="step-indicator">BƯỚC <span id="step-num">1</span> / 3</div>

    <form id="regForm">
        <div class="form-step active">
            <h3>Thông tin cá nhân</h3>
            <div class="group">
                <label>Họ và tên</label>
                <input type="text" id="name" placeholder="Ví dụ: Nguyễn Văn Hải" required>
            </div>
            <div class="group">
                <label>Ngày sinh</label>
                <input type="date" id="dob" required>
            </div>
            <div class="group">
                <label>Giới tính</label>
                <select id="gender" required>
                    <option value="">-- Chọn giới tính --</option>
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>
        </div>

        <div class="form-step">
            <h3>Tài khoản</h3>
            <div class="group">
                <label>Email</label>
                <input type="email" id="email" placeholder="hai@example.com" required>
            </div>
            <div class="group">
                <label>Mật khẩu</label>
                <input type="password" id="pass" placeholder="Ít nhất 6 ký tự" required>
            </div>
            <div class="group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirm" placeholder="Nhập lại mật khẩu" required>
            </div>
        </div>

        <div class="form-step">
            <h3>Xác nhận đăng ký</h3>
            <div id="review-data" class="review-box">
                </div>
        </div>

        <div class="nav-buttons">
            <button type="button" id="prevBtn" style="visibility: hidden;">Quay lại</button>
            <button type="button" id="nextBtn" disabled>Tiếp theo</button>
        </div>
    </form>
</div>

<script src="BaiVeNha2.js"></script>
</body>
</html>

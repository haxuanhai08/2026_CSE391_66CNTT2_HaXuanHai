<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f9; }
        .form-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .error-message { color: red; font-size: 12px; margin-top: 5px; display: none; }
        .success-msg { display: none; text-align: center; color: green; font-size: 18px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-container" id="reg-container">
    <h2>Đăng Ký</h2>
    <form id="reg-form" novalidate>
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" id="fullname" placeholder="Nhập họ và tên">
            <small class="error-message" id="error-fullname"></small>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="name@domain.com">
            <small class="error-message" id="error-email"></small>
        </div>

        <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" id="phone" placeholder="0xxxxxxxxx">
            <small class="error-message" id="error-phone"></small>
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="password" placeholder="Tối thiểu 8 ký tự">
            <small class="error-message" id="error-password"></small>
        </div>

        <div class="form-group">
            <label>Xác nhận mật khẩu</label>
            <input type="password" id="confirm-password">
            <small class="error-message" id="error-confirm-password"></small>
        </div>

        <div class="form-group">
            <label>Giới tính</label>
            <input type="radio" name="gender" value="Nam"> Nam
            <input type="radio" name="gender" value="Nữ"> Nữ
            <small class="error-message" id="error-gender"></small>
        </div>

        <div class="form-group">
            <input type="checkbox" id="terms"> Tôi đồng ý với điều khoản
            <small class="error-message" id="error-terms"></small>
        </div>

        <button type="submit">Đăng ký</button>
    </form>
</div>

<div class="success-msg" id="success-msg"></div>

<script src="Bai2.1.js"></script>
</body>
</html>
